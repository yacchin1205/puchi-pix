name: Deploy site (BLE upload tool + manual) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/ble_upload/**'
      - 'manual/**'
      - 'INTRO-ja.html'
      - 'resources/puchi_pix_logo_256.png'
      - 'resources/puchi-pix.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # ImageMagick is not preinstalled on current runner images
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
      # Site root stays the uploader (existing URL unchanged); the manual
      # is published under /manual/.
      - name: Assemble site
        run: |
          mkdir _site_src
          cp -r tools/ble_upload/. _site_src/
          cp -r manual _site_src/manual
          cp INTRO-ja.html _site_src/
          mkdir _site_src/resources
          cp resources/puchi_pix_logo_256.png _site_src/resources/
          # web-sized overview is derived from the original at build time
          convert resources/puchi-pix.png -resize 1000x1000 -quality 80 _site_src/resources/puchi-pix-overview.jpg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_src
      - id: deployment
        uses: actions/deploy-pages@v4
