name: Compile firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/puchi_pix/**'
      - '.github/workflows/compile.yml'
  pull_request:
    paths:
      - 'firmware/puchi_pix/**'
      - '.github/workflows/compile.yml'

jobs:
  puchi_pix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-stm32-2.12.0
      - run: arduino-cli core install STMicroelectronics:stm32@2.12.0 --additional-urls https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
      - run: arduino-cli compile --fqbn STMicroelectronics:stm32:GenG0:pnum=GENERIC_G030F6PX,xserial=none firmware/puchi_pix
