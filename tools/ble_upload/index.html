<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>puchi-pix BLE upload</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      max-width: 760px;
      margin: 2em auto;
      padding: 0 1em;
      color: #222;
    }
    h1 { font-size: 1.4em; }
    canvas {
      border: 1px solid #ccc;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
    }
    button {
      padding: 0.5em 1.2em;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    .row {
      display: flex;
      gap: 1em;
      align-items: center;
      flex-wrap: wrap;
      margin: 1em 0;
    }
    .panel { display: flex; gap: 1.5em; flex-wrap: wrap; }
    .panel > div p { margin: 0 0 0.4em 0; font-size: 12px; color: #666; }
    #log {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: #f4f4f4;
      padding: 0.8em;
      height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .pill {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      background: #eee;
    }
    .pill.connected { background: #c7e8d0; }
    .pill.error { background: #f5c6c6; }
    .warn {
      background: #fff3c4;
      padding: 0.8em;
      border-radius: 4px;
      margin-bottom: 1em;
    }
    #strip-scroll { overflow-x: auto; padding: 0 8px 4px 8px; }
    #strip { display: flex; gap: 4px; }
    /* Cell geometry: canvas 40px + 1px border each side = 42px box, plus the
       4px flex gap -> 46px pitch. The segment bar math (CELL) relies on it. */
    .thumb { width: 42px; text-align: center; font-size: 10px; color: #666; }
    .thumb canvas {
      display: block;
      width: 40px; height: 40px;
      border: 1px solid #ccc;
      image-rendering: pixelated;
      background: #000;
    }
    .thumb.out { opacity: 0.35; }
    #segbar { position: relative; height: 26px; margin-top: 2px; }
    .band {
      position: absolute;
      top: 3px;
      height: 20px;
      border-radius: 3px;
      font-size: 11px;
      color: #fff;
      text-align: center;
      line-height: 20px;
      overflow: hidden;
      white-space: nowrap;
      user-select: none;
    }
    .band.trim { background: #ddd; }
    .band.entry { background: #4a90d9; }
    .band.tin, .band.tout { background: #8f77c9; }
    .band.main { background: #3cb371; }
    .band.exit { background: #e8963c; }
    .handle {
      position: absolute;
      top: 0;
      width: 14px;
      height: 26px;
      background: #fff;
      border: 1px solid #666;
      border-radius: 4px;
      cursor: ew-resize;
      touch-action: none;
      z-index: 2;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }
    .handle::after {
      content: '';
      position: absolute;
      left: 5px; top: 5px;
      width: 2px; height: 14px;
      background: #888;
    }
  </style>
</head>
<body>
  <h1>puchi-pix BLE upload</h1>

  <div class="row">
    <button id="connect">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <button id="revert" disabled>Revert to default</button>
    <span id="conn-status" class="pill">未接続</span>
    <span id="upload-status" class="pill">idle</span>
  </div>

  <div class="row">
    <input type="file" id="file" accept="image/*">
    <label><span id="bg-label">背景色</span> <input type="color" id="bg" value="#000000"></label>
    <select id="size">
      <option value="auto" selected>サイズ自動</option>
      <option value="64">64×64</option>
      <option value="120">120×120</option>
      <option value="128">128×128</option>
    </select>
    <select id="colors">
      <option value="16" selected>16色 (4bit)</option>
      <option value="256">256色 (8bit)</option>
    </select>
    <button id="upload" disabled>Upload</button>
  </div>

  <div class="panel">
    <div>
      <p id="orig-label">Original (1st frame)</p>
      <canvas id="orig" width="128" height="128"></canvas>
    </div>
    <div>
      <p id="prev-label">Quantized (1st frame preview)</p>
      <canvas id="prev" width="128" height="128"></canvas>
    </div>
  </div>

  <!-- Hidden range state (1-based GIF frames), kept in sync by the
       filmstrip UI and read by the payload builder. -->
  <div class="row" id="range-row" hidden>
    <label hidden><span id="range-label">フレーム範囲</span>
      <input type="number" id="f-start" min="1" value="1" style="width: 4.5em">
      –
      <input type="number" id="f-end" min="1" value="1" style="width: 4.5em">
    </label>
  </div>

  <div class="row">
    <label><input type="checkbox" id="m-loop" checked disabled> <span id="m-loop-label">単純ループ</span></label>
    <label id="m-speed-wrap" hidden><span id="m-speed-label">移動速度 (px/s)</span>
      <input type="number" id="m-speed" min="1" max="255" value="60" style="width: 4.5em"></label>
    <label id="m-gap-wrap" hidden><span id="m-gap-label">退場後の間 (ms)</span>
      <input type="number" id="m-gap" min="0" max="65535" value="1000" style="width: 5.5em"></label>
  </div>

  <div id="strip-row" hidden>
    <div class="row" style="gap: 6px; margin-bottom: 0.4em">
      <label><input type="checkbox" id="e-on" checked> <span id="e-on-label">入場</span></label>
      <label><input type="checkbox" id="ti-on"> <span id="ti-on-label">中割(前)</span></label>
      <label><input type="checkbox" id="to-on"> <span id="to-on-label">中割(後)</span></label>
      <label><input type="checkbox" id="x-on"> <span id="x-on-label">退場</span></label>
      <button id="strip-reset">初期状態に戻す</button>
    </div>
    <div id="strip-scroll">
      <div id="strip"></div>
      <div id="segbar"></div>
    </div>
  </div>

  <div id="log"></div>

  <script type="module">
    import { parseGIF, decompressFrames } from 'https://esm.sh/gifuct-js@2.1.2';

    // ---- BLE UUIDs (must match firmware) ----
    const SERVICE = '5550eec9-b00f-4444-9876-ab12cd34ef01';
    const UPLOAD  = '5550eec9-b00f-4444-9876-ab12cd34ef02';
    const COMMIT  = '5550eec9-b00f-4444-9876-ab12cd34ef03';
    const STATUS  = '5550eec9-b00f-4444-9876-ab12cd34ef04';
    const MOTION  = '5550eec9-b00f-4444-9876-ab12cd34ef05';

    // ---- Image format constants (must match firmware) ----
    // Payload v4: 8B header (magic, version=4, N uint16 LE, size, bpp, reserved)
    // + palette (16 or 256 x uint16 RGB565) + per-frame records:
    //   uint16 duration_ms + uint8 flags (bit0 = keyframe)
    //   keyframe: uint16 rleLen + PackBits RLE of pixels[W*H*bpp/8]
    //   diff:     uint8 rectCount + rects { x, y, w, h, uint16 rleLen +
    //             PackBits RLE of the rect's packed pixels vs prev frame }
    // PackBits: control c < 128 = copy next c+1 bytes; c > 128 = repeat next
    // byte 257-c times. 4bpp data is RLE'd on the packed bytes.
    // No fixed frame cap; the whole payload must fit the firmware buffer.
    const UPLOAD_BUF = 98368;
    const CHUNK_SIZE  = 200;                 // BLE write chunk

    // ---- Localization (browser language: ja -> Japanese, else English) ----
    const I18N = {
      en: {
        connectBtn: 'Connect', disconnectBtn: 'Disconnect',
        connIdle: 'not connected', connOk: 'connected', connLost: 'disconnected', connError: 'error',
        statusNames: ['idle', 'receiving', 'success', 'error'],
        bgLabel: 'Background', bgTitle: 'Fill color for transparent areas and disposal clears',
        sizeAuto: 'Auto size', size128: '128×128 (outer 4px hidden)',
        colors16: '16 colors (4bit)', colors256: '256 colors (8bit)',
        upload: 'Upload', revert: 'Revert to default',
        rangeLabel: 'Frame range',
        origLabel: 'Original (1st frame)',
        prevLabelInitial: 'Quantized (1st frame preview)',
        prevLabel: (s, k) => `Quantized ${s}×${s}, ${k} colors (1st frame preview)`,
        noBluetooth: 'Web Bluetooth is not available in this browser. Use Chrome, Edge or Brave over HTTPS or localhost (iOS browsers are unsupported).',
        logConnecting: n => `connecting to ${n}`,
        logConnected: 'connected', logDisconnected: 'disconnected',
        logStatus: s => `status: ${s}`,
        logConnectError: m => `connect error: ${m}`,
        logLoading: (n, b) => `loading: ${n} (${b} bytes)`,
        logGifInfo: (n, w, h) => `${n} frame(s), canvas ${w}x${h}`,
        logStaticInfo: (w, h) => `static image ${w}x${h} (1 frame)`,
        logBuilt: (b, n, s, p) => `payload built: ${b} bytes (${n} frames, ${s}x${s}, ${p}bpp)`,
        logRebuilt: (b, n, s, p) => `payload rebuilt: ${b} bytes (${n} frames, ${s}x${s}, ${p}bpp)`,
        logParseError: m => `parse error: ${m}`,
        logRebuildError: m => `rebuild error: ${m}`,
        logRange: (s, e, n) => `  frame range ${s}–${e} of ${n}`,
        logFrameStats: (k, d, avg, full) =>
          `  ${k} keyframe(s) + ${d} diff frame(s), ${avg} B/frame avg (full: ${full} B)`,
        errTooBig: (t, buf, n, s, k) =>
          `payload ${t} B > device buffer ${buf} B (${n} frames at ${s}x${s}/${k} colors) — narrow the frame range or reduce size/colors`,
        logReset: 'reset...',
        logUploaded: sec => `uploaded in ${sec}s, committing`,
        logUploadError: m => `upload error: ${m}`,
        logDisconnecting: 'disconnecting...',
        logRevert: 'revert to default',
        logRevertError: m => `revert error: ${m}`,
        revertConfirm: 'Revert the device image to the built-in default? The uploaded animation will be removed.',
        loopLabel: 'Simple loop',
        mSpeedLabel: 'Walk speed (px/s)', mGapLabel: 'Gap after exit (ms)',
        stripReset: 'Reset markers',
        eOnLabel: 'Entry', xOnLabel: 'Exit',
        tiOnLabel: 'Intro', toOnLabel: 'Outro',
        segTIn: 'Intro', segTOut: 'Outro',
        segEntry: 'Entry', segMain: 'Main', segExit: 'Exit',
        logMotionSent: (on, s) => on ? `motion config sent (main starts at frame ${s})` : 'motion config sent (disabled)',
        logMotionError: m => `motion config error: ${m}`,
      },
      ja: {
        connectBtn: '接続', disconnectBtn: '切断',
        connIdle: '未接続', connOk: '接続中', connLost: '切断', connError: 'エラー',
        statusNames: ['待機中', '受信中', '成功', 'エラー'],
        bgLabel: '背景色', bgTitle: '透明部分とdisposalクリアの塗り色',
        sizeAuto: 'サイズ自動', size128: '128×128 (端4pxは表示外)',
        colors16: '16色 (4bit)', colors256: '256色 (8bit)',
        upload: 'アップロード', revert: 'デフォルトに戻す',
        rangeLabel: 'フレーム範囲',
        origLabel: '元画像 (先頭フレーム)',
        prevLabelInitial: '量子化 (先頭フレームプレビュー)',
        prevLabel: (s, k) => `量子化 ${s}×${s} ${k}色 (先頭フレームプレビュー)`,
        noBluetooth: 'このブラウザでは Web Bluetooth が使えません。Chrome / Edge / Brave を HTTPS か localhost で開いてください (iOSの各ブラウザは非対応です)。',
        logConnecting: n => `${n} に接続しています`,
        logConnected: '接続しました', logDisconnected: '切断されました',
        logStatus: s => `ステータス: ${s}`,
        logConnectError: m => `接続エラー: ${m}`,
        logLoading: (n, b) => `読み込み中: ${n} (${b} バイト)`,
        logGifInfo: (n, w, h) => `${n}フレーム, キャンバス ${w}x${h}`,
        logStaticInfo: (w, h) => `静止画 ${w}x${h} (1フレーム)`,
        logBuilt: (b, n, s, p) => `ペイロード生成: ${b} バイト (${n}フレーム, ${s}x${s}, ${p}bpp)`,
        logRebuilt: (b, n, s, p) => `ペイロード再生成: ${b} バイト (${n}フレーム, ${s}x${s}, ${p}bpp)`,
        logParseError: m => `解析エラー: ${m}`,
        logRebuildError: m => `再生成エラー: ${m}`,
        logRange: (s, e, n) => `  フレーム範囲 ${s}–${e} / 全${n}`,
        logFrameStats: (k, d, avg, full) =>
          `  キーフレーム${k} + 差分${d}, 平均 ${avg} B/フレーム (フル: ${full} B)`,
        errTooBig: (t, buf, n, s, k) =>
          `ペイロード ${t} B がデバイスバッファ ${buf} B を超えています (${n}フレーム, ${s}x${s}/${k}色) — フレーム範囲を狭めるか、サイズ/色数を減らしてください`,
        logReset: 'リセット...',
        logUploaded: sec => `アップロード完了 (${sec}秒), コミットします`,
        logUploadError: m => `アップロードエラー: ${m}`,
        logDisconnecting: '切断しています...',
        logRevert: 'デフォルトに戻します',
        logRevertError: m => `リバートエラー: ${m}`,
        revertConfirm: '本体の画像を内蔵デフォルトに戻します。アップロード済みのアニメーションは削除されます。よろしいですか?',
        loopLabel: '単純ループ',
        mSpeedLabel: '移動速度 (px/s)', mGapLabel: '退場後の間 (ms)',
        stripReset: '初期状態に戻す',
        eOnLabel: '入場', xOnLabel: '退場',
        tiOnLabel: '中割(前)', toOnLabel: '中割(後)',
        segTIn: '中割', segTOut: '中割',
        segEntry: '入場', segMain: 'メイン', segExit: '退場',
        logMotionSent: (on, s) => on ? `移動設定を送信しました (メイン開始: フレーム${s})` : '移動設定を送信しました (無効)',
        logMotionError: m => `移動設定エラー: ${m}`,
      },
    };
    const LANG = (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en';
    const T = I18N[LANG];

    // ---- DOM ----
    const $ = id => document.getElementById(id);
    const log = (...args) => {
      $('log').textContent += args.join(' ') + '\n';
      $('log').scrollTop = $('log').scrollHeight;
    };
    const setConnStatus = (s, cls = '') => {
      const el = $('conn-status');
      el.textContent = s;
      el.className = 'pill ' + cls;
    };
    const setUploadStatus = (s, cls = '') => {
      const el = $('upload-status');
      el.textContent = s;
      el.className = 'pill ' + cls;
    };

    // Apply static labels for the selected language
    document.documentElement.lang = LANG;
    $('connect').textContent = T.connectBtn;
    $('disconnect').textContent = T.disconnectBtn;
    $('conn-status').textContent = T.connIdle;
    $('upload-status').textContent = T.statusNames[0];
    $('bg-label').textContent = T.bgLabel;
    $('bg').title = T.bgTitle;
    $('size').options[0].textContent = T.sizeAuto;
    $('size').options[3].textContent = T.size128;
    $('colors').options[0].textContent = T.colors16;
    $('colors').options[1].textContent = T.colors256;
    $('upload').textContent = T.upload;
    $('revert').textContent = T.revert;
    $('range-label').textContent = T.rangeLabel;
    $('orig-label').textContent = T.origLabel;
    $('prev-label').textContent = T.prevLabelInitial;
    $('m-loop-label').textContent = T.loopLabel;
    $('m-speed-label').textContent = T.mSpeedLabel;
    $('m-gap-label').textContent = T.mGapLabel;
    $('strip-reset').textContent = T.stripReset;
    $('e-on-label').textContent = T.eOnLabel;
    $('ti-on-label').textContent = T.tiOnLabel;
    $('to-on-label').textContent = T.toOnLabel;
    $('x-on-label').textContent = T.xOnLabel;

    if (!navigator.bluetooth) {
      const div = document.createElement('div');
      div.className = 'warn';
      div.textContent = T.noBluetooth;
      document.body.prepend(div);
    }

    // ---- BLE state ----
    let device, server, uploadChar, commitChar, statusChar, motionChar;
    let payload = null;
    let lastComposed = null;  // {composed: [{delay, imageData}], W, H} — for rebuild on size change

    // ---- Connect ----
    $('connect').addEventListener('click', async () => {
      try {
        device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'puchi-pix' }],
          optionalServices: [SERVICE]
        });
        log(T.logConnecting(device.name));
        device.addEventListener('gattserverdisconnected', () => {
          setConnStatus(T.connLost);
          $('upload').disabled = true;
          $('revert').disabled = true;
          $('disconnect').disabled = true;
          log(T.logDisconnected);
        });
        server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE);
        uploadChar = await service.getCharacteristic(UPLOAD);
        commitChar = await service.getCharacteristic(COMMIT);
        statusChar = await service.getCharacteristic(STATUS);
        // Older firmware has no Motion characteristic; degrade gracefully.
        motionChar = null;
        try {
          motionChar = await service.getCharacteristic(MOTION);
          const v = await motionChar.readValue();
          if (v.byteLength >= 14 && v.getUint8(0)) {
            // Frame numbers are payload-specific and reset per loaded file,
            // so only the scalar settings are restored here. The loop
            // checkbox stays locked until a multi-frame file is loaded.
            if (!$('m-loop').disabled) $('m-loop').checked = false;
            $('m-speed').value = v.getUint8(9);
            $('m-gap').value = v.getUint16(10, true);
            $('bg').value = c565ToHex(v.getUint16(12, true));
            updateMotionVis();
          }
        } catch (_) {}
        await statusChar.startNotifications();
        statusChar.addEventListener('characteristicvaluechanged', (e) => {
          const v = e.target.value.getUint8(0);
          const cls = v === 2 ? 'connected' : (v === 3 ? 'error' : '');
          setUploadStatus(T.statusNames[v] ?? `code ${v}`, cls);
          log(T.logStatus(T.statusNames[v] ?? v));
        });
        setConnStatus(T.connOk, 'connected');
        $('upload').disabled = (payload === null);
        $('revert').disabled = false;
        $('disconnect').disabled = false;
        log(T.logConnected);
      } catch (e) {
        log(T.logConnectError(e.message));
        setConnStatus(T.connError, 'error');
      }
    });

    // ---- Filmstrip timeline (video-trim style) ----
    // All user-visible frame numbers are 1-based GIF frames; the payload
    // range rides in the hidden f-start/f-end inputs and the BLE wire
    // values (0-based, payload-relative) are derived in sendMotion().
    // Below the thumbnails sits a segment bar with labeled colored bands
    // (entry / intro / main / outro / exit, gray = trimmed) and draggable
    // handles: trim
    // handles at both ends plus the segment dividers. Boundary coordinate
    // b = number of frames left of the boundary (0..n).
    // Markers (abs 1-based GIF frames): rs/re = range, m = entry end (=intro
    // start), l = loop start (l == m -> no intro), o = outro start (null =
    // none), x = exit start (null = reuse entry).
    const stripState = { n: 0, rs: 1, re: 1, m: 2, l: 2, o: null, x: null };
    const CELL = 46;   // thumb box 42px (canvas 40 + 1px borders) + 4px gap
    let segEls = null;

    const syncMarkerInputs = () => {
      const s = stripState;
      $('f-start').value = s.rs;
      $('f-end').value = s.re;
    };

    const motionEnabled = () => !$('m-loop').checked;

    const buildStrip = () => {
      const strip = $('strip');
      strip.innerHTML = '';
      strip.style.width = (stripState.n * CELL - 4) + 'px';
      for (let i = 1; i <= stripState.n; i++) {
        const d = document.createElement('div');
        d.className = 'thumb';
        const { imageData } = lastComposed.composed[i - 1];
        const t = document.createElement('canvas');
        t.width = imageData.width; t.height = imageData.height;
        t.getContext('2d').putImageData(imageData, 0, 0);
        const c = document.createElement('canvas');
        c.width = 40; c.height = 40;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(t, 0, 0, 40, 40);
        const label = document.createElement('div');
        label.textContent = i;
        d.appendChild(c);
        d.appendChild(label);
        strip.appendChild(d);
      }
      buildSegbar();
    };

    // Persistent band/handle elements: they are moved, never recreated, so
    // pointer capture survives for the whole drag.
    const buildSegbar = () => {
      const bar = $('segbar');
      bar.innerHTML = '';
      segEls = {};
      for (const [key, cls, label] of [
        ['btrimL', 'band trim', ''],
        ['bentry', 'band entry', T.segEntry],
        ['btin', 'band tin', T.segTIn],
        ['bmain', 'band main', T.segMain],
        ['btout', 'band tout', T.segTOut],
        ['bexit', 'band exit', T.segExit],
        ['btrimR', 'band trim', ''],
      ]) {
        const d = document.createElement('div');
        d.className = cls;
        d.textContent = label;
        bar.appendChild(d);
        segEls[key] = d;
      }
      for (const kind of ['trimL', 'divM', 'divL', 'divO', 'divX', 'trimR']) {
        const h = document.createElement('div');
        h.className = 'handle';
        h.dataset.kind = kind;
        bar.appendChild(h);
        segEls[kind] = h;
      }
    };

    const updateStrip = () => {
      const { n, rs, re, m, l, o, x } = stripState;
      [...$('strip').children].forEach((d, idx) => {
        const i = idx + 1;
        d.classList.toggle('out', i < rs || i > re);
      });
      if (!segEls) return;
      $('segbar').style.width = (n * CELL - 4) + 'px';
      const place = (el, a, b) => {       // frames a..b inclusive
        if (b < a) { el.style.display = 'none'; return; }
        el.style.display = '';
        el.style.left = ((a - 1) * CELL) + 'px';
        el.style.width = ((b - a + 1) * CELL - 4) + 'px';
      };
      const loopLast = o ? o - 1 : (x ? x - 1 : re);
      place(segEls.btrimL, 1, rs - 1);
      place(segEls.bentry, rs, m - 1);
      place(segEls.btin, m, l - 1);
      place(segEls.bmain, l, loopLast);
      if (o) place(segEls.btout, o, x ? x - 1 : re);
      else segEls.btout.style.display = 'none';
      if (x) place(segEls.bexit, x, re);
      else segEls.bexit.style.display = 'none';
      place(segEls.btrimR, re + 1, n);
      // Handle box = 14px width + 1px borders = 16px; centering its midpoint
      // (left + 8) on the boundary gap center (b*CELL - 2) gives -10.
      const placeHandle = (el, b, show = true) => {
        el.style.display = show ? '' : 'none';
        el.style.left = (b * CELL - 10) + 'px';
      };
      placeHandle(segEls.trimL, rs - 1);
      placeHandle(segEls.divM, m - 1, m > rs);
      placeHandle(segEls.divL, l - 1, l > m);
      placeHandle(segEls.divO, o ? o - 1 : 0, !!o);
      placeHandle(segEls.divX, x ? x - 1 : 0, !!x);
      placeHandle(segEls.trimR, re);
      // Reflect segment existence (drag-off removal / normalize drops too)
      $('e-on').checked = (m > rs);
      $('ti-on').checked = (l > m);
      $('to-on').checked = !!o;
      $('x-on').checked = !!x;
    };

    // Clamp chain shared by every mutation, driven purely by marker values
    // (checkboxes are re-synced from the result in updateStrip). Segments
    // that no longer fit collapse to "absent": m == rs -> no entry,
    // l == m -> no intro, o/x null -> no outro/exit. The main loop always
    // keeps at least one frame.
    const normalizeMarkers = () => {
      const s = stripState;
      if (s.re > s.rs && s.m > s.rs) {
        s.m = Math.min(Math.max(s.m, s.rs + 1), s.re);
      } else {
        s.m = s.rs;
      }
      if (s.m > s.rs && s.l > s.m) {
        s.l = Math.min(Math.max(s.l, s.m + 1), s.re);
      } else {
        s.l = s.m;
      }
      if (s.x !== null && !(s.x > s.l && s.x <= s.re)) s.x = null;
      if (s.o !== null) {
        const hi = s.x ? s.x - 1 : s.re;
        if (!(s.o > s.l && s.o <= hi)) s.o = null;
      }
      syncMarkerInputs();
      updateStrip();
    };

    let dragKind = null;
    let dragRangeBefore = null;
    const applyBoundary = (kind, b) => {
      const s = stripState;
      const clampI = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
      switch (kind) {
        case 'trimL': s.rs = Math.min(b + 1, s.re); break;
        case 'trimR': s.re = Math.max(b, s.rs); break;
        case 'divM': {
          // Without an intro the loop divider follows the entry divider.
          const hadIntro = s.l > s.m;
          s.m = clampI(b + 1, s.rs + 1, hadIntro ? s.l - 1 : s.re);
          if (!hadIntro) s.l = s.m;
          break;
        }
        case 'divL':
          s.l = clampI(b + 1, s.m + 1, s.o ? s.o - 1 : (s.x ? s.x - 1 : s.re));
          break;
        case 'divO':
          s.o = clampI(b + 1, s.l + 1, s.x ? s.x - 1 : s.re);
          break;
        case 'divX':
          if (b >= s.re) s.x = null;     // dragged off the end -> no exit
          else s.x = clampI(b + 1, (s.o ? s.o : s.l) + 1, s.re);
          break;
      }
      normalizeMarkers();
    };
    $('segbar').addEventListener('pointerdown', (e) => {
      const kind = e.target.dataset && e.target.dataset.kind;
      if (!kind) return;
      dragKind = kind;
      dragRangeBefore = `${stripState.rs},${stripState.re}`;
      e.target.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    $('segbar').addEventListener('pointermove', (e) => {
      if (!dragKind) return;
      const rect = $('segbar').getBoundingClientRect();
      const b = Math.max(0, Math.min(stripState.n,
        Math.round((e.clientX - rect.left) / CELL)));
      applyBoundary(dragKind, b);
    });
    const endDrag = () => {
      if (!dragKind) return;
      dragKind = null;
      if (`${stripState.rs},${stripState.re}` !== dragRangeBefore) rebuild();
    };
    $('segbar').addEventListener('pointerup', endDrag);
    $('segbar').addEventListener('pointercancel', endDrag);

    $('e-on').addEventListener('change', () => {
      const s = stripState;
      if ($('e-on').checked) {
        if (s.re <= s.rs) {              // no room for entry + main
          $('e-on').checked = false;
          return;
        }
        s.m = s.rs + 1;
      } else {
        s.m = s.rs;                      // normalize collapses the intro too
      }
      normalizeMarkers();
    });

    $('ti-on').addEventListener('change', () => {
      const s = stripState;
      if ($('ti-on').checked) {
        if (s.m <= s.rs || s.re <= s.m) {  // needs an entry and a loop frame
          $('ti-on').checked = false;
          return;
        }
        s.l = s.m + 1;
      } else {
        s.l = s.m;
      }
      normalizeMarkers();
    });

    $('to-on').addEventListener('change', () => {
      const s = stripState;
      if ($('to-on').checked) {
        const cand = s.x ? s.x - 1 : s.re;  // one frame just before exit/end
        if (cand <= s.l) {
          $('to-on').checked = false;
          return;
        }
        s.o = cand;
      } else {
        s.o = null;
      }
      normalizeMarkers();
    });

    $('x-on').addEventListener('change', () => {
      const s = stripState;
      if ($('x-on').checked) {
        if (s.re <= s.l || (s.o && s.o >= s.re)) {  // no room after loop/outro
          $('x-on').checked = false;
          return;
        }
        s.x = s.re;                      // start with the last frame as exit
      } else {
        s.x = null;
      }
      normalizeMarkers();
    });

    $('strip-reset').addEventListener('click', () => {
      const s = stripState;
      const rangeBefore = `${s.rs},${s.re}`;
      s.rs = 1;
      s.re = s.n;
      s.m = Math.min(2, s.n);
      s.l = s.m;
      s.o = null;
      s.x = null;
      normalizeMarkers();
      if (`${s.rs},${s.re}` !== rangeBefore) rebuild();
    });

    // Simple loop (default) hides the filmstrip and every motion-specific
    // setting; unchecking it reveals them. Returning to simple loop resets
    // the range to all frames so no invisible trim stays applied.
    const updateMotionVis = () => {
      const on = motionEnabled();
      $('strip-row').hidden = !on || stripState.n <= 1;
      $('m-speed-wrap').hidden = !on;
      $('m-gap-wrap').hidden = !on;
      if (!on && stripState.n > 1 &&
          (stripState.rs !== 1 || stripState.re !== stripState.n)) {
        stripState.rs = 1;
        stripState.re = stripState.n;
        syncMarkerInputs();
        rebuild();
      }
      updateStrip();
    };
    $('m-loop').addEventListener('change', updateMotionVis);
    updateMotionVis();

    const resetFrameRange = (n) => {
      // Motion needs at least 2 frames; until a usable file is loaded the
      // simple-loop checkbox stays locked in its default state.
      $('m-loop').disabled = (n <= 1);
      if (n <= 1) $('m-loop').checked = true;
      $('f-start').max = n;
      $('f-end').max = n;
      stripState.n = n;
      stripState.rs = 1;
      stripState.re = n;
      stripState.m = Math.min(2, n);
      stripState.l = stripState.m;
      stripState.o = null;
      stripState.x = null;
      syncMarkerInputs();
      updateMotionVis();
    };

    // Read the selected range as [start, end] (1-based, inclusive), clamped
    // to [1, n] and normalized so start <= end; writes clamps back to the UI.
    const frameRange = (n) => {
      let s = Math.min(Math.max($('f-start').value | 0, 1), n);
      let e = Math.min(Math.max($('f-end').value | 0, 1), n);
      if (s > e) [s, e] = [e, s];
      $('f-start').value = s;
      $('f-end').value = e;
      return [s, e];
    };

    // ---- File pick / background change: (re)compose and build ----
    let lastFile = null;

    const recompose = async (resetRange = false) => {
      if (!lastFile) return;
      try {
        lastComposed = await fileToComposed(lastFile);
        if (resetRange) resetFrameRange(lastComposed.composed.length);
        buildStrip();     // thumbnails follow bg-color recomposition too
        updateStrip();
        payload = buildPayload(lastComposed);
        log(T.logBuilt(payload.length, payload[3] | (payload[4] << 8), payload[5], payload[6]));
        if (server && server.connected) $('upload').disabled = false;
      } catch (err) {
        log(T.logParseError(err.message));
        payload = null;
      }
    };

    $('file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      log(T.logLoading(file.name, file.size));
      lastFile = file;
      await recompose(true);
    });
    $('bg').addEventListener('change', recompose);

    // ---- Size / color change: rebuild payload from the last loaded image ----
    const rebuild = () => {
      if (!lastComposed) return;
      try {
        payload = buildPayload(lastComposed);
        log(T.logRebuilt(payload.length, payload[3] | (payload[4] << 8), payload[5], payload[6]));
      } catch (err) {
        log(T.logRebuildError(err.message));
        payload = null;
      }
    };
    $('size').addEventListener('change', rebuild);
    $('colors').addEventListener('change', rebuild);
    $('f-start').addEventListener('change', rebuild);
    $('f-end').addEventListener('change', rebuild);

    // ---- Upload ----
    $('upload').addEventListener('click', async () => {
      if (!payload || !uploadChar || !commitChar) return;
      $('upload').disabled = true;
      try {
        log(T.logReset);
        await commitChar.writeValueWithResponse(new Uint8Array([0x02]));
        const t0 = performance.now();
        const total = payload.length;
        for (let i = 0; i < total; i += CHUNK_SIZE) {
          const slice = payload.slice(i, Math.min(i + CHUNK_SIZE, total));
          await uploadChar.writeValueWithResponse(slice);
          if ((i / CHUNK_SIZE) % 16 === 0) {
            log(`  ${i}/${total} (${Math.round(i / total * 100)}%)`);
          }
        }
        const t1 = performance.now();
        log(T.logUploaded(((t1 - t0) / 1000).toFixed(2)));
        await commitChar.writeValueWithResponse(new Uint8Array([0x01]));
        // Commit resets the device-side motion config, so the settings ride
        // along with every upload (including bg for the walk backdrop).
        if (motionChar) await sendMotion();
      } catch (e) {
        log(T.logUploadError(e.message));
      } finally {
        $('upload').disabled = false;
      }
    });

    // ---- Motion config ----
    // 14 bytes: [enabled, mainStart LE u16, loopStart LE u16, outStart LE
    // u16, exitStart LE u16, speed px/s, gap LE u16 ms, bg RGB565 LE u16],
    // all frame values 0-based relative to the trimmed payload (see the
    // firmware header for segment semantics and sentinels). Sent
    // automatically after each commit (a commit resets the device-side
    // config). The firmware validates the frame numbers against the
    // committed frame count and collapses out-of-range segments.
    const hexTo565 = (h) => {
      const n = parseInt(h.slice(1), 16);
      return ((((n >> 16) & 0xFF) >> 3) << 11) |
             ((((n >> 8) & 0xFF) >> 2) << 5) |
             ((n & 0xFF) >> 3);
    };
    const c565ToHex = (c) => {
      const r5 = (c >> 11) & 0x1F, g6 = (c >> 5) & 0x3F, b5 = c & 0x1F;
      const r = (r5 << 3) | (r5 >> 2);
      const g = (g6 << 2) | (g6 >> 4);
      const b = (b5 << 3) | (b5 >> 2);
      return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
    };

    const sendMotion = async () => {
      const s = stripState;
      const on = motionEnabled() ? 1 : 0;
      const start = Math.max(0, s.m - s.rs);
      const loop = Math.max(0, s.l - s.rs);
      const out = s.o ? (s.o - s.rs) : 0;
      const exit = s.x ? (s.x - s.rs) : 0;
      const speed = Math.min(Math.max($('m-speed').value | 0, 1), 255);
      const gap = Math.min(Math.max($('m-gap').value | 0, 0), 65535);
      $('m-speed').value = speed;
      $('m-gap').value = gap;
      const bg = hexTo565($('bg').value);
      const b = new Uint8Array([
        on,
        start & 0xFF, start >> 8,
        loop & 0xFF, loop >> 8,
        out & 0xFF, out >> 8,
        exit & 0xFF, exit >> 8,
        speed,
        gap & 0xFF, gap >> 8,
        bg & 0xFF, bg >> 8,
      ]);
      try {
        await motionChar.writeValueWithResponse(b);
        log(T.logMotionSent(on, start));
      } catch (e) {
        log(T.logMotionError(e.message));
      }
    };

    // ---- Disconnect ----
    $('disconnect').addEventListener('click', () => {
      if (device && device.gatt.connected) {
        log(T.logDisconnecting);
        device.gatt.disconnect();
      }
    });

    // ---- Revert ----
    $('revert').addEventListener('click', async () => {
      if (!commitChar) return;
      if (!window.confirm(T.revertConfirm)) return;
      log(T.logRevert);
      try {
        await commitChar.writeValueWithResponse(new Uint8Array([0x03]));
      } catch (e) {
        log(T.logRevertError(e.message));
      }
    });

    // ---- Image file -> composed frame list ----

    async function fileToComposed(file) {
      if (file.type === 'image/gif') {
        const buf = await file.arrayBuffer();
        const parsed = parseGIF(buf);
        const frames = decompressFrames(parsed, true);
        log(T.logGifInfo(frames.length, parsed.lsd.width, parsed.lsd.height));
        return composeGifFrames(parsed, frames);
      }
      // Static image (PNG, JPEG, WebP, ...) -> single frame, alpha flattened
      // onto the selected background color
      const bmp = await createImageBitmap(file);
      const canvas = document.createElement('canvas');
      canvas.width = bmp.width; canvas.height = bmp.height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = $('bg').value;
      ctx.fillRect(0, 0, bmp.width, bmp.height);
      ctx.drawImage(bmp, 0, 0);
      log(T.logStaticInfo(bmp.width, bmp.height));
      return {
        composed: [{ delay: 1000, imageData: ctx.getImageData(0, 0, bmp.width, bmp.height) }],
        W: bmp.width, H: bmp.height
      };
    }

    function composeGifFrames(parsed, frames) {
      const W = parsed.lsd.width, H = parsed.lsd.height;
      const bg = $('bg').value;

      // Composite each patch onto a full-size canvas, honoring per-frame
      // disposal. Transparency is meaningless on the device, so both the
      // initial canvas and disposal=2 clears use the selected background.
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      const composed = [];
      for (const f of frames) {
        const pre = (f.disposalType === 3) ? ctx.getImageData(0, 0, W, H) : null;
        const patchCanvas = document.createElement('canvas');
        patchCanvas.width = f.dims.width;
        patchCanvas.height = f.dims.height;
        const pctx = patchCanvas.getContext('2d');
        const id = pctx.createImageData(f.dims.width, f.dims.height);
        id.data.set(f.patch);
        pctx.putImageData(id, 0, 0);
        ctx.drawImage(patchCanvas, f.dims.left, f.dims.top);
        composed.push({
          delay: f.delay,
          imageData: ctx.getImageData(0, 0, W, H)
        });
        // Disposal applies after the frame is shown:
        // 2 = clear the frame's rect to background, 3 = restore pre-frame state
        if (f.disposalType === 2) {
          ctx.fillStyle = bg;
          ctx.fillRect(f.dims.left, f.dims.top, f.dims.width, f.dims.height);
        } else if (pre) {
          ctx.putImageData(pre, 0, 0);
        }
      }
      return { composed, W, H };
    }

    // ---- Composed frames -> payload ----

    function buildPayload({ composed: allFrames, W, H }) {
      // Restrict to the selected frame range (lets oversized GIFs fit the
      // device buffer by uploading a portion of the animation)
      const [fs, fe] = frameRange(allFrames.length);
      const composed = allFrames.slice(fs - 1, fe);
      if (composed.length < allFrames.length) {
        log(T.logRange(fs, fe, allFrames.length));
      }

      // Show original (1st frame of the selected range, composited)
      drawCanvasTo($('orig'), composed[0].imageData);

      // Target size: auto picks 120 (full display coverage) for sources
      // larger than 64. 128 stays selectable for native-128 pixel art where
      // edge cropping beats non-integer resampling.
      const sel = $('size').value;
      const size = (sel === 'auto') ? ((W > 64 || H > 64) ? 120 : 64) : parseInt(sel, 10);
      const K = parseInt($('colors').value, 10);      // 16 or 256
      const bpp = (K === 256) ? 8 : 4;
      $('prev-label').textContent = T.prevLabel(size, K);

      const resized = composed.map(c => resizeImageData(c.imageData, size, size));

      // Use exact source palette if input already <=K unique colors, else median cut
      const palette = buildPalette(resized, K);

      // Quantize and pack each frame
      const packed = resized.map(rgba => quantizeAndPack(rgba, palette, size, bpp));

      // Render preview of 1st packed frame
      drawPackedTo($('prev'), packed[0], palette, size, bpp);

      // Per-frame records (RLE-compressed): keyframe when first or when the
      // encoded diff isn't smaller than the encoded full frame.
      const frameBytes = size * size * bpp / 8;
      let keyframes = 0;
      const records = packed.map((cur, i) => {
        // gifuct-js delay is already in milliseconds. Clamp / fallback for
        // GIFs that report 0 or absurdly large.
        let dur = composed[i].delay | 0;
        if (dur < 20) dur = 100;
        if (dur > 65535) dur = 65535;
        const keyRle = rleEncode(cur);
        if (i > 0) {
          const rects = diffRects(packed[i - 1], cur, size, bpp);
          for (const rc of rects) rc.rle = rleEncode(rc.data);
          const diffSize = 1 + rects.reduce((a, rc) => a + 6 + rc.rle.length, 0);
          if (diffSize < 2 + keyRle.length) return { dur, rects };
        }
        keyframes++;
        return { dur, full: keyRle };
      });

      // Assemble payload (v4)
      const N = records.length;
      const palBytes = K * 2;
      const recSize = r => 3 + (r.full ? 2 + r.full.length
        : 1 + r.rects.reduce((a, rc) => a + 6 + rc.rle.length, 0));
      const total = 8 + palBytes + records.reduce((a, r) => a + recSize(r), 0);
      if (total > UPLOAD_BUF) {
        throw new Error(T.errTooBig(total, UPLOAD_BUF, N, size, K));
      }

      const out = new Uint8Array(total);
      out[0] = 0x50;          // 'P'
      out[1] = 0x50;          // 'P'
      out[2] = 4;             // version
      out[3] = N & 0xFF;      // frame count (uint16 LE)
      out[4] = (N >> 8) & 0xFF;
      out[5] = size;
      out[6] = bpp;
      out[7] = 0;             // reserved
      for (let i = 0; i < K; i++) {
        const [r, g, b] = palette[i];
        const c565 = ((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3);
        out[8 + i * 2]     = c565 & 0xFF;
        out[8 + i * 2 + 1] = (c565 >> 8) & 0xFF;
      }
      let off = 8 + palBytes;
      for (const r of records) {
        out[off++] = r.dur & 0xFF;
        out[off++] = (r.dur >> 8) & 0xFF;
        out[off++] = r.full ? 1 : 0;   // flags: bit0 = keyframe
        if (r.full) {
          out[off++] = r.full.length & 0xFF;
          out[off++] = (r.full.length >> 8) & 0xFF;
          out.set(r.full, off);
          off += r.full.length;
        } else {
          out[off++] = r.rects.length;
          for (const rc of r.rects) {
            out[off++] = rc.x; out[off++] = rc.y;
            out[off++] = rc.w; out[off++] = rc.h;
            out[off++] = rc.rle.length & 0xFF;
            out[off++] = (rc.rle.length >> 8) & 0xFF;
            out.set(rc.rle, off);
            off += rc.rle.length;
          }
        }
      }
      log(T.logFrameStats(keyframes, N - keyframes, (total / N).toFixed(0), frameBytes + 3));
      return out;
    }

    // PackBits RLE encoder (see format notes above). Worst case grows the
    // data by ~1/128 + 1 byte, so v4 is effectively never larger than v3.
    function rleEncode(data) {
      const out = [];
      const n = data.length;
      let i = 0;
      while (i < n) {
        let run = 1;
        while (i + run < n && data[i + run] === data[i] && run < 128) run++;
        if (run >= 3) {
          out.push(257 - run, data[i]);
          i += run;
        } else {
          let j = i, lit = 0;
          while (j < n) {
            let r = 1;
            while (j + r < n && data[j + r] === data[j] && r < 128) r++;
            if (r >= 3 || lit + r > 128) break;
            j += r; lit += r;
          }
          out.push(lit - 1);
          for (let k = i; k < j; k++) out.push(data[k]);
          i = j;
        }
      }
      return Uint8Array.from(out);
    }

    const unpackPixel = (p, i, bpp) =>
      bpp === 8 ? p[i] : ((i & 1) ? (p[i >> 1] & 0x0F) : (p[i >> 1] >> 4));

    // Diff two packed frames: bands of consecutive changed rows, each clipped
    // to its changed-column extent. Returns [{x, y, w, h, data}]; empty when
    // the frames are identical. Band count is at most size/2 (< 256).
    function diffRects(prev, cur, size, bpp) {
      const rowMin = new Int16Array(size).fill(-1);
      const rowMax = new Int16Array(size).fill(-1);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const i = y * size + x;
          if (unpackPixel(prev, i, bpp) !== unpackPixel(cur, i, bpp)) {
            if (rowMin[y] < 0) rowMin[y] = x;
            rowMax[y] = x;
          }
        }
      }
      const rects = [];
      for (let y = 0; y < size; ) {
        if (rowMin[y] < 0) { y++; continue; }
        let y1 = y, x0 = rowMin[y], x1 = rowMax[y];
        while (y1 + 1 < size && rowMin[y1 + 1] >= 0) {
          y1++;
          x0 = Math.min(x0, rowMin[y1]);
          x1 = Math.max(x1, rowMax[y1]);
        }
        rects.push(packRect(cur, size, bpp, x0, y, x1 - x0 + 1, y1 - y + 1));
        y = y1 + 1;
      }
      return rects;
    }

    function packRect(cur, size, bpp, x, y, w, h) {
      const n = w * h;
      const data = new Uint8Array(bpp === 8 ? n : (n + 1) >> 1);
      let k = 0;
      for (let dy = 0; dy < h; dy++) {
        for (let dx = 0; dx < w; dx++, k++) {
          const v = unpackPixel(cur, (y + dy) * size + x + dx, bpp);
          if (bpp === 8) data[k] = v;
          else if (k & 1) data[k >> 1] |= v;
          else data[k >> 1] = v << 4;
        }
      }
      return { x, y, w, h, data };
    }

    function resizeImageData(imageData, w, h) {
      const src = document.createElement('canvas');
      src.width = imageData.width;
      src.height = imageData.height;
      src.getContext('2d').putImageData(imageData, 0, 0);

      const dst = document.createElement('canvas');
      dst.width = w; dst.height = h;
      const dctx = dst.getContext('2d');
      dctx.imageSmoothingEnabled = false;
      dctx.drawImage(src, 0, 0, w, h);
      return dctx.getImageData(0, 0, w, h).data;
    }

    function buildPalette(rgbaFrames, K) {
      // If the input has <=K distinct RGB colors, use them directly (no
      // averaging-induced color drift). Otherwise fall back to median cut.
      const seen = new Map();
      let exceeded = false;
      outer: for (const rgba of rgbaFrames) {
        for (let i = 0; i < rgba.length; i += 4) {
          const key = (rgba[i] << 16) | (rgba[i + 1] << 8) | rgba[i + 2];
          if (!seen.has(key)) {
            seen.set(key, [rgba[i], rgba[i + 1], rgba[i + 2]]);
            if (seen.size > K) { exceeded = true; break outer; }
          }
        }
      }
      if (!exceeded) {
        const pal = [...seen.values()];
        while (pal.length < K) pal.push([0, 0, 0]);  // pad unused slots
        return pal;
      }
      return medianCutPalette(rgbaFrames, K);
    }

    function medianCutPalette(rgbaFrames, K) {
      // Collect every pixel from every frame as RGB triples
      const total = rgbaFrames.reduce((a, b) => a + b.length / 4, 0);
      const pixels = new Array(total);
      let p = 0;
      for (const rgba of rgbaFrames) {
        for (let i = 0; i < rgba.length; i += 4) {
          pixels[p++] = [rgba[i], rgba[i + 1], rgba[i + 2]];
        }
      }
      let boxes = [pixels];
      while (boxes.length < K) {
        let bestIdx = -1, bestRange = -1, bestAxis = 0;
        for (let i = 0; i < boxes.length; i++) {
          const b = boxes[i];
          if (b.length < 2) continue;
          for (let a = 0; a < 3; a++) {
            let mn = 255, mx = 0;
            for (const px of b) {
              if (px[a] < mn) mn = px[a];
              if (px[a] > mx) mx = px[a];
            }
            const r = mx - mn;
            if (r > bestRange) { bestRange = r; bestIdx = i; bestAxis = a; }
          }
        }
        if (bestIdx === -1 || bestRange <= 0) break;
        const b = boxes[bestIdx];
        b.sort((p, q) => p[bestAxis] - q[bestAxis]);
        const mid = Math.floor(b.length / 2);
        boxes.splice(bestIdx, 1, b.slice(0, mid), b.slice(mid));
      }
      while (boxes.length < K) boxes.push([[0, 0, 0]]);
      return boxes.map(b => {
        let r = 0, g = 0, bb = 0;
        for (const px of b) { r += px[0]; g += px[1]; bb += px[2]; }
        const n = b.length || 1;
        return [Math.round(r / n), Math.round(g / n), Math.round(bb / n)];
      });
    }

    function quantizeAndPack(rgba, palette, size, bpp) {
      // RGB565 quantization: snap palette to RGB565 first, then map source to nearest
      const K = palette.length;
      const pal565 = palette.map(([r, g, b]) => {
        const r5 = (r >> 3) & 0x1F, g6 = (g >> 2) & 0x3F, b5 = (b >> 3) & 0x1F;
        return [
          (r5 << 3) | (r5 >> 2),
          (g6 << 2) | (g6 >> 4),
          (b5 << 3) | (b5 >> 2)
        ];
      });
      const npx = size * size;
      const out = new Uint8Array(bpp === 8 ? npx : npx / 2);
      const memo = new Map();  // color -> palette index
      for (let i = 0; i < npx; i++) {
        const r = rgba[i * 4 + 0];
        const g = rgba[i * 4 + 1];
        const b = rgba[i * 4 + 2];
        const key = (r << 16) | (g << 8) | b;
        let bestIdx = memo.get(key);
        if (bestIdx === undefined) {
          let bestDist = Infinity;
          bestIdx = 0;
          for (let p = 0; p < K; p++) {
            const dr = r - pal565[p][0];
            const dg = g - pal565[p][1];
            const db = b - pal565[p][2];
            const d = dr * dr + dg * dg + db * db;
            if (d < bestDist) { bestDist = d; bestIdx = p; }
          }
          memo.set(key, bestIdx);
        }
        if (bpp === 8) {
          out[i] = bestIdx;
        } else {
          const byteIdx = i >> 1;
          if (i & 1) out[byteIdx] = (out[byteIdx] & 0xF0) | (bestIdx & 0x0F);
          else       out[byteIdx] = (out[byteIdx] & 0x0F) | ((bestIdx & 0x0F) << 4);
        }
      }
      return out;
    }

    function drawCanvasTo(targetCanvas, imageData) {
      const ctx = targetCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      const tmp = document.createElement('canvas');
      tmp.width = imageData.width;
      tmp.height = imageData.height;
      tmp.getContext('2d').putImageData(imageData, 0, 0);
      ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
      ctx.drawImage(tmp, 0, 0, targetCanvas.width, targetCanvas.height);
    }

    function drawPackedTo(targetCanvas, packed, palette, size, bpp) {
      const tmp = document.createElement('canvas');
      tmp.width = size; tmp.height = size;
      const tctx = tmp.getContext('2d');
      const id = tctx.createImageData(size, size);
      for (let i = 0; i < size * size; i++) {
        let palIdx;
        if (bpp === 8) {
          palIdx = packed[i];
        } else {
          const byte = packed[i >> 1];
          palIdx = (i & 1) ? (byte & 0x0F) : (byte >> 4);
        }
        const [r, g, b] = palette[palIdx];
        id.data[i * 4 + 0] = r;
        id.data[i * 4 + 1] = g;
        id.data[i * 4 + 2] = b;
        id.data[i * 4 + 3] = 255;
      }
      tctx.putImageData(id, 0, 0);
      const ctx = targetCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
      ctx.drawImage(tmp, 0, 0, targetCanvas.width, targetCanvas.height);
    }

    // Debug/test hook: expose the current payload bytes
    window._payload = () => payload;
  </script>
