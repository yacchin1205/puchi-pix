<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>puchi-pix BLE upload</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      max-width: 760px;
      margin: 2em auto;
      padding: 0 1em;
      color: #222;
    }
    h1 { font-size: 1.4em; }
    canvas {
      border: 1px solid #ccc;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
    }
    button {
      padding: 0.5em 1.2em;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    .row {
      display: flex;
      gap: 1em;
      align-items: center;
      flex-wrap: wrap;
      margin: 1em 0;
    }
    .panel { display: flex; gap: 1.5em; flex-wrap: wrap; }
    .panel > div p { margin: 0 0 0.4em 0; font-size: 12px; color: #666; }
    #log {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: #f4f4f4;
      padding: 0.8em;
      height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .pill {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      background: #eee;
    }
    .pill.connected { background: #c7e8d0; }
    .pill.error { background: #f5c6c6; }
    .warn {
      background: #fff3c4;
      padding: 0.8em;
      border-radius: 4px;
      margin-bottom: 1em;
    }
  </style>
</head>
<body>
  <h1>puchi-pix BLE upload</h1>

  <div class="row">
    <button id="connect">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <span id="conn-status" class="pill">未接続</span>
    <span id="upload-status" class="pill">idle</span>
  </div>

  <div class="row">
    <input type="file" id="file" accept="image/*">
    <label>背景色 <input type="color" id="bg" value="#000000" title="透明部分とdisposalクリアの塗り色"></label>
    <select id="size">
      <option value="auto" selected>サイズ自動</option>
      <option value="64">64×64</option>
      <option value="120">120×120</option>
      <option value="128">128×128 (端4pxは表示外)</option>
    </select>
    <select id="colors">
      <option value="16" selected>16色 (4bit)</option>
      <option value="256">256色 (8bit)</option>
    </select>
    <button id="upload" disabled>Upload</button>
    <button id="revert" disabled>Revert to default</button>
  </div>

  <div class="row" id="range-row" hidden>
    <label>フレーム範囲
      <input type="number" id="f-start" min="1" value="1" style="width: 4.5em">
      –
      <input type="number" id="f-end" min="1" value="1" style="width: 4.5em">
    </label>
    <span id="f-total" class="pill"></span>
  </div>

  <div class="panel">
    <div>
      <p>Original (1st frame)</p>
      <canvas id="orig" width="128" height="128"></canvas>
    </div>
    <div>
      <p id="prev-label">Quantized (1st frame preview)</p>
      <canvas id="prev" width="128" height="128"></canvas>
    </div>
  </div>

  <div id="log"></div>

  <script type="module">
    import { parseGIF, decompressFrames } from 'https://esm.sh/gifuct-js@2.1.2';

    // ---- BLE UUIDs (must match firmware) ----
    const SERVICE = '5550eec9-b00f-4444-9876-ab12cd34ef01';
    const UPLOAD  = '5550eec9-b00f-4444-9876-ab12cd34ef02';
    const COMMIT  = '5550eec9-b00f-4444-9876-ab12cd34ef03';
    const STATUS  = '5550eec9-b00f-4444-9876-ab12cd34ef04';

    // ---- Image format constants (must match firmware) ----
    // Payload v3: 8B header (magic, version=3, N uint16 LE, size, bpp, reserved)
    // + palette (16 or 256 x uint16 RGB565) + per-frame records:
    //   uint16 duration_ms + uint8 flags (bit0 = keyframe)
    //   keyframe: full pixels[W*H*bpp/8]
    //   diff:     uint8 rectCount + rects { x, y, w, h + pixels vs prev frame }
    // No fixed frame cap; the whole payload must fit the firmware buffer.
    const UPLOAD_BUF = 98368;
    const CHUNK_SIZE  = 200;                 // BLE write chunk

    // ---- DOM ----
    const $ = id => document.getElementById(id);
    const log = (...args) => {
      $('log').textContent += args.join(' ') + '\n';
      $('log').scrollTop = $('log').scrollHeight;
    };
    const setConnStatus = (s, cls = '') => {
      const el = $('conn-status');
      el.textContent = s;
      el.className = 'pill ' + cls;
    };
    const setUploadStatus = (s, cls = '') => {
      const el = $('upload-status');
      el.textContent = s;
      el.className = 'pill ' + cls;
    };

    if (!navigator.bluetooth) {
      document.body.insertAdjacentHTML('afterbegin',
        '<div class="warn">このブラウザでは Web Bluetooth が使えません。Chrome / Edge / Brave などをお試しください。HTTPS か localhost で開く必要があります。</div>');
    }

    // ---- BLE state ----
    let device, server, uploadChar, commitChar, statusChar;
    let payload = null;
    let lastComposed = null;  // {composed: [{delay, imageData}], W, H} — for rebuild on size change

    // ---- Connect ----
    $('connect').addEventListener('click', async () => {
      try {
        device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'puchi-pix' }],
          optionalServices: [SERVICE]
        });
        log('connecting to', device.name);
        device.addEventListener('gattserverdisconnected', () => {
          setConnStatus('切断');
          $('upload').disabled = true;
          $('revert').disabled = true;
          $('disconnect').disabled = true;
          log('disconnected');
        });
        server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE);
        uploadChar = await service.getCharacteristic(UPLOAD);
        commitChar = await service.getCharacteristic(COMMIT);
        statusChar = await service.getCharacteristic(STATUS);
        await statusChar.startNotifications();
        statusChar.addEventListener('characteristicvaluechanged', (e) => {
          const v = e.target.value.getUint8(0);
          const names = ['idle', 'receiving', 'success', 'error'];
          const cls = v === 2 ? 'connected' : (v === 3 ? 'error' : '');
          setUploadStatus(names[v] ?? `code ${v}`, cls);
          log('status:', names[v] ?? v);
        });
        setConnStatus('接続中', 'connected');
        $('upload').disabled = (payload === null);
        $('revert').disabled = false;
        $('disconnect').disabled = false;
        log('connected');
      } catch (e) {
        log('connect error:', e.message);
        setConnStatus('エラー', 'error');
      }
    });

    // ---- Frame range selection ----
    const resetFrameRange = (n) => {
      $('range-row').hidden = (n <= 1);
      $('f-start').max = n; $('f-start').value = 1;
      $('f-end').max = n;   $('f-end').value = n;
      $('f-total').textContent = `全${n}フレーム`;
    };

    // Read the selected range as [start, end] (1-based, inclusive), clamped
    // to [1, n] and normalized so start <= end; writes clamps back to the UI.
    const frameRange = (n) => {
      let s = Math.min(Math.max($('f-start').value | 0, 1), n);
      let e = Math.min(Math.max($('f-end').value | 0, 1), n);
      if (s > e) [s, e] = [e, s];
      $('f-start').value = s;
      $('f-end').value = e;
      return [s, e];
    };

    // ---- File pick / background change: (re)compose and build ----
    let lastFile = null;

    const recompose = async (resetRange = false) => {
      if (!lastFile) return;
      try {
        lastComposed = await fileToComposed(lastFile);
        if (resetRange) resetFrameRange(lastComposed.composed.length);
        payload = buildPayload(lastComposed);
        log(`payload built: ${payload.length} bytes (${payload[3] | (payload[4] << 8)} frames, ${payload[5]}x${payload[5]}, ${payload[6]}bpp)`);
        if (server && server.connected) $('upload').disabled = false;
      } catch (err) {
        log('parse error:', err.message);
        payload = null;
      }
    };

    $('file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      log(`loading: ${file.name} (${file.size} bytes)`);
      lastFile = file;
      await recompose(true);
    });
    $('bg').addEventListener('change', recompose);

    // ---- Size / color change: rebuild payload from the last loaded image ----
    const rebuild = () => {
      if (!lastComposed) return;
      try {
        payload = buildPayload(lastComposed);
        log(`payload rebuilt: ${payload.length} bytes (${payload[3] | (payload[4] << 8)} frames, ${payload[5]}x${payload[5]}, ${payload[6]}bpp)`);
      } catch (err) {
        log('rebuild error:', err.message);
        payload = null;
      }
    };
    $('size').addEventListener('change', rebuild);
    $('colors').addEventListener('change', rebuild);
    $('f-start').addEventListener('change', rebuild);
    $('f-end').addEventListener('change', rebuild);

    // ---- Upload ----
    $('upload').addEventListener('click', async () => {
      if (!payload || !uploadChar || !commitChar) return;
      $('upload').disabled = true;
      try {
        log('reset...');
        await commitChar.writeValueWithResponse(new Uint8Array([0x02]));
        const t0 = performance.now();
        const total = payload.length;
        for (let i = 0; i < total; i += CHUNK_SIZE) {
          const slice = payload.slice(i, Math.min(i + CHUNK_SIZE, total));
          await uploadChar.writeValueWithResponse(slice);
          if ((i / CHUNK_SIZE) % 16 === 0) {
            log(`  ${i}/${total} (${Math.round(i / total * 100)}%)`);
          }
        }
        const t1 = performance.now();
        log(`uploaded in ${((t1 - t0) / 1000).toFixed(2)}s, committing`);
        await commitChar.writeValueWithResponse(new Uint8Array([0x01]));
      } catch (e) {
        log('upload error:', e.message);
      } finally {
        $('upload').disabled = false;
      }
    });

    // ---- Disconnect ----
    $('disconnect').addEventListener('click', () => {
      if (device && device.gatt.connected) {
        log('disconnecting...');
        device.gatt.disconnect();
      }
    });

    // ---- Revert ----
    $('revert').addEventListener('click', async () => {
      if (!commitChar) return;
      log('revert to default');
      try {
        await commitChar.writeValueWithResponse(new Uint8Array([0x03]));
      } catch (e) {
        log('revert error:', e.message);
      }
    });

    // ---- Image file -> composed frame list ----

    async function fileToComposed(file) {
      if (file.type === 'image/gif') {
        const buf = await file.arrayBuffer();
        const parsed = parseGIF(buf);
        const frames = decompressFrames(parsed, true);
        log(`${frames.length} frame(s), canvas ${parsed.lsd.width}x${parsed.lsd.height}`);
        return composeGifFrames(parsed, frames);
      }
      // Static image (PNG, JPEG, WebP, ...) -> single frame, alpha flattened
      // onto the selected background color
      const bmp = await createImageBitmap(file);
      const canvas = document.createElement('canvas');
      canvas.width = bmp.width; canvas.height = bmp.height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = $('bg').value;
      ctx.fillRect(0, 0, bmp.width, bmp.height);
      ctx.drawImage(bmp, 0, 0);
      log(`static image ${bmp.width}x${bmp.height} (1 frame)`);
      return {
        composed: [{ delay: 1000, imageData: ctx.getImageData(0, 0, bmp.width, bmp.height) }],
        W: bmp.width, H: bmp.height
      };
    }

    function composeGifFrames(parsed, frames) {
      const W = parsed.lsd.width, H = parsed.lsd.height;
      const bg = $('bg').value;

      // Composite each patch onto a full-size canvas, honoring per-frame
      // disposal. Transparency is meaningless on the device, so both the
      // initial canvas and disposal=2 clears use the selected background.
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      const composed = [];
      for (const f of frames) {
        const pre = (f.disposalType === 3) ? ctx.getImageData(0, 0, W, H) : null;
        const patchCanvas = document.createElement('canvas');
        patchCanvas.width = f.dims.width;
        patchCanvas.height = f.dims.height;
        const pctx = patchCanvas.getContext('2d');
        const id = pctx.createImageData(f.dims.width, f.dims.height);
        id.data.set(f.patch);
        pctx.putImageData(id, 0, 0);
        ctx.drawImage(patchCanvas, f.dims.left, f.dims.top);
        composed.push({
          delay: f.delay,
          imageData: ctx.getImageData(0, 0, W, H)
        });
        // Disposal applies after the frame is shown:
        // 2 = clear the frame's rect to background, 3 = restore pre-frame state
        if (f.disposalType === 2) {
          ctx.fillStyle = bg;
          ctx.fillRect(f.dims.left, f.dims.top, f.dims.width, f.dims.height);
        } else if (pre) {
          ctx.putImageData(pre, 0, 0);
        }
      }
      return { composed, W, H };
    }

    // ---- Composed frames -> payload ----

    function buildPayload({ composed: allFrames, W, H }) {
      // Restrict to the selected frame range (lets oversized GIFs fit the
      // device buffer by uploading a portion of the animation)
      const [fs, fe] = frameRange(allFrames.length);
      const composed = allFrames.slice(fs - 1, fe);
      if (composed.length < allFrames.length) {
        log(`  frame range ${fs}–${fe} of ${allFrames.length}`);
      }

      // Show original (1st frame of the selected range, composited)
      drawCanvasTo($('orig'), composed[0].imageData);

      // Target size: auto picks 120 (full display coverage) for sources
      // larger than 64. 128 stays selectable for native-128 pixel art where
      // edge cropping beats non-integer resampling.
      const sel = $('size').value;
      const size = (sel === 'auto') ? ((W > 64 || H > 64) ? 120 : 64) : parseInt(sel, 10);
      const K = parseInt($('colors').value, 10);      // 16 or 256
      const bpp = (K === 256) ? 8 : 4;
      $('prev-label').textContent = `Quantized ${size}×${size} ${K}色 (1st frame preview)`;

      const resized = composed.map(c => resizeImageData(c.imageData, size, size));

      // Use exact source palette if input already <=K unique colors, else median cut
      const palette = buildPalette(resized, K);

      // Quantize and pack each frame
      const packed = resized.map(rgba => quantizeAndPack(rgba, palette, size, bpp));

      // Render preview of 1st packed frame
      drawPackedTo($('prev'), packed[0], palette, size, bpp);

      // Per-frame records: keyframe when first or when the diff isn't smaller
      const frameBytes = size * size * bpp / 8;
      let keyframes = 0;
      const records = packed.map((cur, i) => {
        // gifuct-js delay is already in milliseconds. Clamp / fallback for
        // GIFs that report 0 or absurdly large.
        let dur = composed[i].delay | 0;
        if (dur < 20) dur = 100;
        if (dur > 65535) dur = 65535;
        if (i > 0) {
          const rects = diffRects(packed[i - 1], cur, size, bpp);
          const diffSize = 1 + rects.reduce((a, r) => a + 4 + r.data.length, 0);
          if (diffSize < frameBytes) return { dur, rects };
        }
        keyframes++;
        return { dur, full: cur };
      });

      // Assemble payload (v3)
      const N = records.length;
      const palBytes = K * 2;
      const recSize = r => 3 + (r.full ? frameBytes
        : 1 + r.rects.reduce((a, rc) => a + 4 + rc.data.length, 0));
      const total = 8 + palBytes + records.reduce((a, r) => a + recSize(r), 0);
      if (total > UPLOAD_BUF) {
        throw new Error(`payload ${total} B > device buffer ${UPLOAD_BUF} B ` +
          `(${N} frames at ${size}x${size}/${K}色) — フレーム範囲を狭めるか、サイズ/色数を減らしてください`);
      }

      const out = new Uint8Array(total);
      out[0] = 0x50;          // 'P'
      out[1] = 0x50;          // 'P'
      out[2] = 3;             // version
      out[3] = N & 0xFF;      // frame count (uint16 LE)
      out[4] = (N >> 8) & 0xFF;
      out[5] = size;
      out[6] = bpp;
      out[7] = 0;             // reserved
      for (let i = 0; i < K; i++) {
        const [r, g, b] = palette[i];
        const c565 = ((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3);
        out[8 + i * 2]     = c565 & 0xFF;
        out[8 + i * 2 + 1] = (c565 >> 8) & 0xFF;
      }
      let off = 8 + palBytes;
      for (const r of records) {
        out[off++] = r.dur & 0xFF;
        out[off++] = (r.dur >> 8) & 0xFF;
        out[off++] = r.full ? 1 : 0;   // flags: bit0 = keyframe
        if (r.full) {
          out.set(r.full, off);
          off += frameBytes;
        } else {
          out[off++] = r.rects.length;
          for (const rc of r.rects) {
            out[off++] = rc.x; out[off++] = rc.y;
            out[off++] = rc.w; out[off++] = rc.h;
            out.set(rc.data, off);
            off += rc.data.length;
          }
        }
      }
      log(`  ${keyframes} keyframe(s) + ${N - keyframes} diff frame(s), ` +
        `${(total / N).toFixed(0)} B/frame avg (full: ${frameBytes + 3} B)`);
      return out;
    }

    const unpackPixel = (p, i, bpp) =>
      bpp === 8 ? p[i] : ((i & 1) ? (p[i >> 1] & 0x0F) : (p[i >> 1] >> 4));

    // Diff two packed frames: bands of consecutive changed rows, each clipped
    // to its changed-column extent. Returns [{x, y, w, h, data}]; empty when
    // the frames are identical. Band count is at most size/2 (< 256).
    function diffRects(prev, cur, size, bpp) {
      const rowMin = new Int16Array(size).fill(-1);
      const rowMax = new Int16Array(size).fill(-1);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const i = y * size + x;
          if (unpackPixel(prev, i, bpp) !== unpackPixel(cur, i, bpp)) {
            if (rowMin[y] < 0) rowMin[y] = x;
            rowMax[y] = x;
          }
        }
      }
      const rects = [];
      for (let y = 0; y < size; ) {
        if (rowMin[y] < 0) { y++; continue; }
        let y1 = y, x0 = rowMin[y], x1 = rowMax[y];
        while (y1 + 1 < size && rowMin[y1 + 1] >= 0) {
          y1++;
          x0 = Math.min(x0, rowMin[y1]);
          x1 = Math.max(x1, rowMax[y1]);
        }
        rects.push(packRect(cur, size, bpp, x0, y, x1 - x0 + 1, y1 - y + 1));
        y = y1 + 1;
      }
      return rects;
    }

    function packRect(cur, size, bpp, x, y, w, h) {
      const n = w * h;
      const data = new Uint8Array(bpp === 8 ? n : (n + 1) >> 1);
      let k = 0;
      for (let dy = 0; dy < h; dy++) {
        for (let dx = 0; dx < w; dx++, k++) {
          const v = unpackPixel(cur, (y + dy) * size + x + dx, bpp);
          if (bpp === 8) data[k] = v;
          else if (k & 1) data[k >> 1] |= v;
          else data[k >> 1] = v << 4;
        }
      }
      return { x, y, w, h, data };
    }

    function resizeImageData(imageData, w, h) {
      const src = document.createElement('canvas');
      src.width = imageData.width;
      src.height = imageData.height;
      src.getContext('2d').putImageData(imageData, 0, 0);

      const dst = document.createElement('canvas');
      dst.width = w; dst.height = h;
      const dctx = dst.getContext('2d');
      dctx.imageSmoothingEnabled = false;
      dctx.drawImage(src, 0, 0, w, h);
      return dctx.getImageData(0, 0, w, h).data;
    }

    function buildPalette(rgbaFrames, K) {
      // If the input has <=K distinct RGB colors, use them directly (no
      // averaging-induced color drift). Otherwise fall back to median cut.
      const seen = new Map();
      let exceeded = false;
      outer: for (const rgba of rgbaFrames) {
        for (let i = 0; i < rgba.length; i += 4) {
          const key = (rgba[i] << 16) | (rgba[i + 1] << 8) | rgba[i + 2];
          if (!seen.has(key)) {
            seen.set(key, [rgba[i], rgba[i + 1], rgba[i + 2]]);
            if (seen.size > K) { exceeded = true; break outer; }
          }
        }
      }
      if (!exceeded) {
        const pal = [...seen.values()];
        while (pal.length < K) pal.push([0, 0, 0]);  // pad unused slots
        return pal;
      }
      return medianCutPalette(rgbaFrames, K);
    }

    function medianCutPalette(rgbaFrames, K) {
      // Collect every pixel from every frame as RGB triples
      const total = rgbaFrames.reduce((a, b) => a + b.length / 4, 0);
      const pixels = new Array(total);
      let p = 0;
      for (const rgba of rgbaFrames) {
        for (let i = 0; i < rgba.length; i += 4) {
          pixels[p++] = [rgba[i], rgba[i + 1], rgba[i + 2]];
        }
      }
      let boxes = [pixels];
      while (boxes.length < K) {
        let bestIdx = -1, bestRange = -1, bestAxis = 0;
        for (let i = 0; i < boxes.length; i++) {
          const b = boxes[i];
          if (b.length < 2) continue;
          for (let a = 0; a < 3; a++) {
            let mn = 255, mx = 0;
            for (const px of b) {
              if (px[a] < mn) mn = px[a];
              if (px[a] > mx) mx = px[a];
            }
            const r = mx - mn;
            if (r > bestRange) { bestRange = r; bestIdx = i; bestAxis = a; }
          }
        }
        if (bestIdx === -1 || bestRange <= 0) break;
        const b = boxes[bestIdx];
        b.sort((p, q) => p[bestAxis] - q[bestAxis]);
        const mid = Math.floor(b.length / 2);
        boxes.splice(bestIdx, 1, b.slice(0, mid), b.slice(mid));
      }
      while (boxes.length < K) boxes.push([[0, 0, 0]]);
      return boxes.map(b => {
        let r = 0, g = 0, bb = 0;
        for (const px of b) { r += px[0]; g += px[1]; bb += px[2]; }
        const n = b.length || 1;
        return [Math.round(r / n), Math.round(g / n), Math.round(bb / n)];
      });
    }

    function quantizeAndPack(rgba, palette, size, bpp) {
      // RGB565 quantization: snap palette to RGB565 first, then map source to nearest
      const K = palette.length;
      const pal565 = palette.map(([r, g, b]) => {
        const r5 = (r >> 3) & 0x1F, g6 = (g >> 2) & 0x3F, b5 = (b >> 3) & 0x1F;
        return [
          (r5 << 3) | (r5 >> 2),
          (g6 << 2) | (g6 >> 4),
          (b5 << 3) | (b5 >> 2)
        ];
      });
      const npx = size * size;
      const out = new Uint8Array(bpp === 8 ? npx : npx / 2);
      const memo = new Map();  // color -> palette index
      for (let i = 0; i < npx; i++) {
        const r = rgba[i * 4 + 0];
        const g = rgba[i * 4 + 1];
        const b = rgba[i * 4 + 2];
        const key = (r << 16) | (g << 8) | b;
        let bestIdx = memo.get(key);
        if (bestIdx === undefined) {
          let bestDist = Infinity;
          bestIdx = 0;
          for (let p = 0; p < K; p++) {
            const dr = r - pal565[p][0];
            const dg = g - pal565[p][1];
            const db = b - pal565[p][2];
            const d = dr * dr + dg * dg + db * db;
            if (d < bestDist) { bestDist = d; bestIdx = p; }
          }
          memo.set(key, bestIdx);
        }
        if (bpp === 8) {
          out[i] = bestIdx;
        } else {
          const byteIdx = i >> 1;
          if (i & 1) out[byteIdx] = (out[byteIdx] & 0xF0) | (bestIdx & 0x0F);
          else       out[byteIdx] = (out[byteIdx] & 0x0F) | ((bestIdx & 0x0F) << 4);
        }
      }
      return out;
    }

    function drawCanvasTo(targetCanvas, imageData) {
      const ctx = targetCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      const tmp = document.createElement('canvas');
      tmp.width = imageData.width;
      tmp.height = imageData.height;
      tmp.getContext('2d').putImageData(imageData, 0, 0);
      ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
      ctx.drawImage(tmp, 0, 0, targetCanvas.width, targetCanvas.height);
    }

    function drawPackedTo(targetCanvas, packed, palette, size, bpp) {
      const tmp = document.createElement('canvas');
      tmp.width = size; tmp.height = size;
      const tctx = tmp.getContext('2d');
      const id = tctx.createImageData(size, size);
      for (let i = 0; i < size * size; i++) {
        let palIdx;
        if (bpp === 8) {
          palIdx = packed[i];
        } else {
          const byte = packed[i >> 1];
          palIdx = (i & 1) ? (byte & 0x0F) : (byte >> 4);
        }
        const [r, g, b] = palette[palIdx];
        id.data[i * 4 + 0] = r;
        id.data[i * 4 + 1] = g;
        id.data[i * 4 + 2] = b;
        id.data[i * 4 + 3] = 255;
      }
      tctx.putImageData(id, 0, 0);
      const ctx = targetCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
      ctx.drawImage(tmp, 0, 0, targetCanvas.width, targetCanvas.height);
    }
  </script>
